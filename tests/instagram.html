<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="instagram">
        <blockquote
          class="instagram-media"
          data-instgrm-captioned
          data-instgrm-version="7"
        >
          <a href="https://www.instagram.com/p/CneIvozoiFs/"></a>
        </blockquote>
      </div>
      <script>
        (function () {
          let z = document.createElement("iframe");
          //z.style.height = '0px';
          //z.style.border = '0px';
                  z.setAttribute("http-equiv", "X-Content-Type-Options");
                  z.setAttribute("content", "");
          document.body.appendChild(z);
          function doWork() {
            script = document.createElement("script");
            script.setAttribute('type', "text/javascript");
            script.addEventListener("load", function () {
              window.instgrm = z.contentWindow.instgrm;
              window.instgrm.Embeds.process();
              document.querySelectorAll(".instagram-media").forEach(function (e) {
                let parr = e.parentElement;
                z.contentDocument.body.append(e);
                window.instgrm.Embeds.process();
                setTimeout(function () {
                  [...z.contentDocument.body.children].forEach(function (el) {
                    parr.append(el);
                  });
                }, 10000);
              });
            });
            script.src = "https://platform.instagram.com/en_US/embeds.js";
            z.contentDocument.head.appendChild(script);
          }
          if (z.contentDocument.readyState === "complete") {
            doWork();
          } else {
            z.contentWindow.addEventListener("load", function () {
              doWork();
            });
          }
        })();
      </script>
  </body>
</html>
